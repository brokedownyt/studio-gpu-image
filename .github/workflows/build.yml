name: build-studio-gpu-image
on:
  workflow_dispatch:
  push:
    paths: [Dockerfile, .github/workflows/build.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (cuda devel base is big)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: render image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: render
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/studio-gpu:render-v1
      - name: blender image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: blender
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/studio-gpu:blender-v1
